[project]
name = "capitoldesk"
version = "0.1.0"
description = "Autonomous congressional-disclosure options desk"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "claude-agent-sdk>=0.1.0",
    "alpaca-py>=0.33",
    "pypdf>=5.0",
    "pdf2image>=1.17",
    "pydantic>=2.9",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "rich>=13.9",
    "typer>=0.15",
]

[project.scripts]
desk = "capitoldesk.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/capitoldesk"]
